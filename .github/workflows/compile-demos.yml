name: Compile demos

# The clean TinyTeX job installs the release artifact's exact requirements,
# then runs its full Doctor and the actual compiler demo regressions.
on:
  pull_request:
    paths:
      - "templates/**"
      - "src/**"
      - "tests/**"
      - "csl/**"
      - "filters/**"
      - "package*.json"
      - "scripts/**"
      - "requirements-latex.txt"
      - "examples/**"
      - ".github/workflows/compile-demos.yml"
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "src/**"
      - "tests/**"
      - "csl/**"
      - "filters/**"
      - "package*.json"
      - "scripts/**"
      - "requirements-latex.txt"
      - "examples/**"
      - ".github/workflows/compile-demos.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compile-all-demos:
    name: Compile every demo on TinyTeX
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install behavioral harness dependencies
        run: npm ci

      - name: Build and verify the actual VSIX
        run: |
          set -euo pipefail
          npm run package:vsix
          version="$(node -p 'require("./package.json").version')"
          vsix="inkwell-$version.vsix"
          node scripts/verify-vsix.mjs "$vsix" --tag "v$version"
          artifact_dir="$RUNNER_TEMP/inkwell-demo-artifact"
          mkdir -p "$artifact_dir"
          unzip -q "$vsix" -d "$artifact_dir"
          echo "ARTIFACT_ROOT=$artifact_dir/extension" >> "$GITHUB_ENV"

      - name: Install pandoc 3.x and pandoc-crossref
        run: |
          set -euo pipefail
          PANDOC_VERSION="3.9"
          curl --fail --location --retry 3 "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb" --output "$RUNNER_TEMP/pandoc.deb"
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          pandoc --version
          curl --fail --location --retry 3 https://api.github.com/repos/lierdakil/pandoc-crossref/releases/latest --output "$RUNNER_TEMP/crossref-release.json"
          crossref_url="$(node -e 'const release=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const asset=release.assets.find(item=>item.name.endsWith("Linux-X64.tar.xz"));if(!asset)throw new Error("Required crossref release asset is missing");process.stdout.write(asset.browser_download_url)' "$RUNNER_TEMP/crossref-release.json")"
          curl --fail --location --proto '=https' --retry 3 "$crossref_url" --output "$RUNNER_TEMP/pandoc-crossref.tar.xz"
          mkdir -p "$RUNNER_TEMP/pandoc-crossref"
          tar -xJf "$RUNNER_TEMP/pandoc-crossref.tar.xz" -C "$RUNNER_TEMP/pandoc-crossref"
          sudo install -m 755 "$RUNNER_TEMP/pandoc-crossref/pandoc-crossref" /usr/local/bin/pandoc-crossref
          pandoc-crossref --version

      - name: Install TinyTeX and system rendering dependencies
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://yihui.org/tinytex/install-bin-unix.sh" --output "$RUNNER_TEMP/install-tinytex.sh"
          sh "$RUNNER_TEMP/install-tinytex.sh"
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y ghostscript python3-venv

      - name: Install required LaTeX packages
        run: |
          set -euo pipefail
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          tlmgr update --self
          node - "$ARTIFACT_ROOT/requirements-latex.txt" "$RUNNER_TEMP/inkwell-tex-packages.txt" <<'NODE'
          const fs = require('node:fs');
          const names = [...new Set(fs.readFileSync(process.argv[2], 'utf8').split(/\r?\n/).map(line => line.replace(/#.*/, '').trim()).filter(Boolean))];
          if (!names.length || names.some(name => !/^[a-z0-9][a-z0-9+.-]*$/.test(name))) throw new Error('Invalid or empty artifact TeX requirements');
          fs.writeFileSync(process.argv[3], names.join('\n') + '\n');
          NODE
          mapfile -t packages < "$RUNNER_TEMP/inkwell-tex-packages.txt"
          tlmgr install "${packages[@]}"

      - name: Install isolated demo Python environment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/inkwell-demo-python"
          python="$RUNNER_TEMP/inkwell-demo-python/bin/python"
          "$python" -m pip install --requirement "$ARTIFACT_ROOT/examples/requirements.txt" pypdf
          "$python" -m pip check
          echo "INKWELL_TEST_PYTHON=$python" >> "$GITHUB_ENV"
          echo "INKWELL_PDF_PYTHON=$python" >> "$GITHUB_ENV"

      - name: Install and verify isolated Mermaid renderer
        run: |
          set -euo pipefail
          mermaid_dir="$RUNNER_TEMP/inkwell-ci-mermaid"
          mkdir -p "$mermaid_dir"
          cp scripts/ci-tools/mermaid/package.json scripts/ci-tools/mermaid/package-lock.json "$mermaid_dir/"
          export PUPPETEER_CACHE_DIR="$RUNNER_TEMP/inkwell-ci-mermaid-browser"
          npm ci --prefix "$mermaid_dir" --no-audit --no-fund
          echo "$mermaid_dir/node_modules/.bin" >> "$GITHUB_PATH"
          echo "PUPPETEER_CACHE_DIR=$PUPPETEER_CACHE_DIR" >> "$GITHUB_ENV"
          "$mermaid_dir/node_modules/.bin/mmdc" --version
          printf 'flowchart LR\n  Input --> Verified\n' > "$mermaid_dir/smoke.mmd"
          "$mermaid_dir/node_modules/.bin/mmdc" -i "$mermaid_dir/smoke.mmd" -o "$mermaid_dir/smoke.svg"
          test -s "$mermaid_dir/smoke.svg"

      - name: Verify every artifact requirement and a fresh PDF smoke build
        run: |
          set -euo pipefail
          mkdir -p benchmarks
          node "$ARTIFACT_ROOT/out/doctor-cli.js" --extension-root "$ARTIFACT_ROOT" --full --json --require-tool ghostscript > benchmarks/doctor.json

      - name: Compile every demo
        run: |
          set -euo pipefail
          bash scripts/compile-all-demos.sh --report=benchmarks/current.json

      - name: Upload verification reports on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: demo-validation-report
          path: |
            benchmarks/current.json
            benchmarks/doctor.json
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-diagnostics
          path: |
            benchmarks/*.json
            /tmp/inkwell-demos-*/**/*.log
            /tmp/inkwell-vscode/**/compile.log
            /tmp/inkwell-vscode/**/*.tex
          if-no-files-found: warn
