name: Compile demos

# The clean TinyTeX job installs the release artifact's exact requirements,
# then runs its full Doctor and the actual compiler demo regressions.
on:
  pull_request:
    paths:
      - "templates/**"
      - "src/**"
      - "tests/**"
      - "csl/**"
      - "filters/**"
      - "package*.json"
      - "scripts/**"
      - "requirements-latex.txt"
      - "examples/**"
      - ".github/workflows/compile-demos.yml"
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "src/**"
      - "tests/**"
      - "csl/**"
      - "filters/**"
      - "package*.json"
      - "scripts/**"
      - "requirements-latex.txt"
      - "examples/**"
      - ".github/workflows/compile-demos.yml"
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Optional trusted Verify run whose exact VSIX should be reused
        required: false
        type: string
      baseline-artifact:
        description: Optional same-machine valid baseline artifact retained by that Verify run
        required: false
        type: string
  workflow_call:
    inputs:
      candidate-artifact:
        type: string
        default: ''
      release-commit:
        type: string
        default: ''
      baseline-artifact:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  compile-all-demos:
    name: Compile every demo on TinyTeX
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-commit || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install behavioral harness dependencies
        run: npm ci

      - name: Authenticate a separately dispatched candidate source
        if: inputs.candidate_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: node scripts/release-evidence.mjs verify-run --commit "$(git rev-parse HEAD)" --run-id "$CANDIDATE_RUN_ID" --workflow .github/workflows/verify.yml

      - name: Download the already built candidate
        if: inputs.candidate-artifact != '' || inputs.candidate_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.candidate-artifact || 'inkwell-candidate' }}
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id || github.run_id }}

      - name: Build and verify the actual VSIX
        env:
          CANDIDATE_ARTIFACT: ${{ inputs.candidate-artifact || (inputs.candidate_run_id && 'inkwell-candidate') || '' }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [ -z "$CANDIDATE_ARTIFACT" ]; then
            npm run package:vsix
            mkdir candidate
            mv "inkwell-$version.vsix" candidate/
            node scripts/release-evidence.mjs init --vsix "candidate/inkwell-$version.vsix" --commit "$(git rev-parse HEAD)" --output candidate/candidate.json
          fi
          vsix="$GITHUB_WORKSPACE/candidate/inkwell-$version.vsix"
          node scripts/verify-vsix.mjs "$vsix" --tag "v$version"
          node scripts/release-evidence.mjs init --vsix "$vsix" --commit "$(git rev-parse HEAD)" --output candidate/rechecked.json
          cmp candidate/candidate.json candidate/rechecked.json
          artifact_dir="$RUNNER_TEMP/inkwell-demo-artifact"
          mkdir -p "$artifact_dir"
          unzip -q "$vsix" -d "$artifact_dir"
          echo "ARTIFACT_ROOT=$artifact_dir/extension" >> "$GITHUB_ENV"
          echo "VSIX=$vsix" >> "$GITHUB_ENV"

      - name: Install pandoc 3.x and pandoc-crossref
        run: |
          set -euo pipefail
          PANDOC_VERSION="3.9"
          curl --fail --location --retry 3 "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb" --output "$RUNNER_TEMP/pandoc.deb"
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          pandoc --version
          curl --fail --location --retry 3 https://api.github.com/repos/lierdakil/pandoc-crossref/releases/latest --output "$RUNNER_TEMP/crossref-release.json"
          crossref_url="$(node -e 'const release=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const asset=release.assets.find(item=>item.name.endsWith("Linux-X64.tar.xz"));if(!asset)throw new Error("Required crossref release asset is missing");process.stdout.write(asset.browser_download_url)' "$RUNNER_TEMP/crossref-release.json")"
          curl --fail --location --proto '=https' --retry 3 "$crossref_url" --output "$RUNNER_TEMP/pandoc-crossref.tar.xz"
          mkdir -p "$RUNNER_TEMP/pandoc-crossref"
          tar -xJf "$RUNNER_TEMP/pandoc-crossref.tar.xz" -C "$RUNNER_TEMP/pandoc-crossref"
          sudo install -m 755 "$RUNNER_TEMP/pandoc-crossref/pandoc-crossref" /usr/local/bin/pandoc-crossref
          pandoc-crossref --version

      - name: Install TinyTeX and system rendering dependencies
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://yihui.org/tinytex/install-bin-unix.sh" --output "$RUNNER_TEMP/install-tinytex.sh"
          sh "$RUNNER_TEMP/install-tinytex.sh"
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y ghostscript python3-venv poppler-utils

      - name: Install required LaTeX packages
        run: |
          set -euo pipefail
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          tlmgr update --self
          node - "$ARTIFACT_ROOT/requirements-latex.txt" "$RUNNER_TEMP/inkwell-tex-packages.txt" <<'NODE'
          const fs = require('node:fs');
          const names = [...new Set(fs.readFileSync(process.argv[2], 'utf8').split(/\r?\n/).map(line => line.replace(/#.*/, '').trim()).filter(Boolean))];
          if (!names.length || names.some(name => !/^[a-z0-9][a-z0-9+.-]*$/.test(name))) throw new Error('Invalid or empty artifact TeX requirements');
          fs.writeFileSync(process.argv[3], names.join('\n') + '\n');
          NODE
          mapfile -t packages < "$RUNNER_TEMP/inkwell-tex-packages.txt"
          tlmgr install "${packages[@]}"

      - name: Install isolated demo Python environment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/inkwell-demo-python"
          python="$RUNNER_TEMP/inkwell-demo-python/bin/python"
          "$python" -m pip install --requirement "$ARTIFACT_ROOT/examples/requirements.txt" pypdf
          "$python" -m pip check
          echo "INKWELL_TEST_PYTHON=$python" >> "$GITHUB_ENV"
          echo "INKWELL_PDF_PYTHON=$python" >> "$GITHUB_ENV"

      - name: Install and verify isolated Mermaid renderer
        run: |
          set -euo pipefail
          mermaid_dir="$RUNNER_TEMP/inkwell-ci-mermaid"
          mkdir -p "$mermaid_dir"
          cp scripts/ci-tools/mermaid/package.json scripts/ci-tools/mermaid/package-lock.json "$mermaid_dir/"
          export PUPPETEER_CACHE_DIR="$RUNNER_TEMP/inkwell-ci-mermaid-browser"
          npm ci --prefix "$mermaid_dir" --no-audit --no-fund
          echo "$mermaid_dir/node_modules/.bin" >> "$GITHUB_PATH"
          echo "PUPPETEER_CACHE_DIR=$PUPPETEER_CACHE_DIR" >> "$GITHUB_ENV"
          "$mermaid_dir/node_modules/.bin/mmdc" --version
          printf 'flowchart LR\n  Input --> Verified\n' > "$mermaid_dir/smoke.mmd"
          "$mermaid_dir/node_modules/.bin/mmdc" -i "$mermaid_dir/smoke.mmd" -o "$mermaid_dir/smoke.svg"
          test -s "$mermaid_dir/smoke.svg"

      - name: Verify every artifact requirement and a fresh PDF smoke build
        run: |
          set -euo pipefail
          mkdir -p benchmarks
          node "$ARTIFACT_ROOT/out/doctor-cli.js" --extension-root "$ARTIFACT_ROOT" --full --json --require-tool ghostscript > benchmarks/doctor.json

      - name: Compile every demo through the same packaged runtime twice
        run: |
          set -euo pipefail
          npm run compile
          node scripts/check-demos.cjs --vsix="$VSIX" --vsix-root="$ARTIFACT_ROOT" --warmups=1 --repetitions=5 --report=benchmarks/current.json
          node scripts/check-demos.cjs --vsix="$VSIX" --vsix-root="$ARTIFACT_ROOT" --warmups=1 --repetitions=5 --report=benchmarks/confirmation.json
          node scripts/release-evidence.mjs record --candidate candidate/candidate.json --gate demos --report benchmarks/current.json --report benchmarks/confirmation.json --report benchmarks/doctor.json --output evidence/demos.evidence.json

      - name: Download a same-machine valid performance baseline
        if: inputs.baseline-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.baseline-artifact }}
          path: baseline
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id || github.run_id }}

      - name: Reject sustained benchmark regressions
        if: inputs.baseline-artifact != ''
        run: |
          set -euo pipefail
          node scripts/check-benchmark-regression.mjs --baseline=baseline/baseline.json --candidate=benchmarks/current.json --confirmation=benchmarks/confirmation.json --report=benchmarks/performance.json
          node scripts/release-evidence.mjs record --candidate candidate/candidate.json --gate performance --report benchmarks/performance.json --report benchmarks/current.json --report benchmarks/confirmation.json --report baseline/baseline.json --output evidence/performance.evidence.json

      - name: Explain the absent baseline gate
        if: inputs.baseline-artifact == ''
        run: echo 'Timing reports are retained; release remains blocked until a valid same-machine baseline passes the sustained comparison gate.' >> "$GITHUB_STEP_SUMMARY"

      - name: Run, edit, insert and compile in an actual packaged extension host
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/inkwell-editor"
          curl --fail --location --proto '=https' --retry 3 https://update.code.visualstudio.com/latest/linux-x64/stable --output "$RUNNER_TEMP/editor.tar.gz"
          tar -xzf "$RUNNER_TEMP/editor.tar.gz" -C "$RUNNER_TEMP/inkwell-editor"
          xvfb-run -a node scripts/check-extension-host.cjs --vsix "$VSIX" --editor "$RUNNER_TEMP/inkwell-editor/VSCode-linux-x64/code" --mode full --samples 5 --warmups 1 --report benchmarks/run-to-pdf.json
          node scripts/release-evidence.mjs record --candidate candidate/candidate.json --gate run-to-pdf --report benchmarks/run-to-pdf.json --output evidence/run-to-pdf.evidence.json
          node scripts/release-evidence.mjs record --candidate candidate/candidate.json --gate warm-preview --report benchmarks/run-to-pdf.json --output evidence/warm-preview.evidence.json

      - name: Upload verification reports on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: demo-validation-report
          path: |
            benchmarks/*.json
            evidence/
            candidate/candidate.json
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-diagnostics
          path: |
            benchmarks/*.json
            /tmp/inkwell-demos-*/**/*.log
            /tmp/inkwell-vscode/**/compile.log
            /tmp/inkwell-vscode/**/*.tex
          if-no-files-found: warn
